alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
rbac:
  create: false
server:
  automountServiceAccountToken: false
  global:
    scrape_interval: 15s
  fullnameOverride: prometheus-server
  persistentVolume:
    enabled: false
  retention: 6h
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
# Only scrape this demo; avoid the chart's broad Kubernetes scrape jobs.
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: demo-service
        metrics_path: /metrics
        static_configs:
          - targets: [demo-service.demo.svc.cluster.local:8080]
            labels:
              service: demo-service
              namespace: demo
