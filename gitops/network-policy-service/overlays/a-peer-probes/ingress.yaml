apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
  name: network-service-a
spec:
  rules:
    - host: service-a.localhost
      http:
        paths:
          - backend:
              service:
                name: network-policy-service
                port:
                  name: http
            path: /
            pathType: Prefix