apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-demo-a
  namespace: network-demo-b
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network-policy-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network-demo-a
          podSelector:
            matchLabels:
              app.kubernetes.io/name: network-policy-service
      ports:
        - protocol: TCP
          port: 8080
